[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "weftsh"
version = "0.1.0"
description = "Python SDK for Weft: a real git repository per user, session or agent, created and written over REST."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Weft" }]
keywords = ["weft", "git", "repositories", "agents", "sdk", "storage"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://weft.sh/docs/sdk/python/"
Source = "https://github.com/weftsh/python-sdk"
Issues = "https://github.com/weftsh/python-sdk/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/weftsh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
files = ["src", "tests", "scripts", "examples"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Generated from the async client, where `async for … yield` has no `yield from`.
"src/weftsh/_sync_client.py" = ["UP028"]

[tool.ruff.format]
# Generated; `scripts/unasync.py --check` holds it to the async source instead.
exclude = ["src/weftsh/_sync_client.py"]
